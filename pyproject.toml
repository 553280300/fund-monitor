[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-monitor"
version = "0.1.0"
description = "Windows-first, local-first fund and market monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "pydantic>=2.9,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
fund-monitor = "fund_monitor.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
