name: fund-monitor

on:
  schedule:
    # UTC = 北京时间 02:00/06:00/10:00/14:00（脚本内部判断交易日，周末自动跳过）
    - cron: '0 18,22,2,6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r headless/requirements.txt

      - name: Run monitor
        run: python headless/monitor.py --config headless/config.yaml --state headless/state.json --output headless/last-report.md
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Commit state (history for next comparison)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headless/state.json headless/last-report.md
          git commit -m "chore: update monitor state" || echo "no changes to commit"
          git push
